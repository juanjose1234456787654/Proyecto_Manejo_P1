<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GolStats - Sala de Prensa</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/sala_prensa_celeste.css">
</head>
<body class="bg-dark text-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black py-3 border-bottom border-info">
        <div class="container">
            <a class="navbar-brand fw-bold text-info fs-3" href="../index.html">⚽ GolStats</a>
            <a href="../index.html" class="btn btn-outline-light btn-sm">← Volver al Hub</a>
        </div>
    </nav>

    <!-- Encabezado Principal -->
    <main class="container my-4">
        <div class="text-center mb-5">
            <div class="mb-2 fs-1">📰</div>
            <h1 class="fw-bold text-info display-5">SALA DE PRENSA</h1>
            <p class="text-secondary lead max-w-600 mx-auto">
                Noticias de último minuto, rumores de fichajes y los titulares más destacados del mundo del fútbol.
            </p>
        </div>

        <!-- Contenedor Dinámico de Noticias -->
        <div class="row g-4" id="newsContainer">
            <!-- Las tarjetas de noticias se cargan dinámicamente con JavaScript -->
        </div>
    </main>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/sala_prensa_celeste.js"></script>
</body>
</html>
