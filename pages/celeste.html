<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GolStats - Sala de Prensa</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/sala_celeste.css">
</head>
<body class="bg-dark text-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black py-3 border-bottom border-success">
        <div class="container">
            <a class="navbar-brand fw-bold text-success fs-3" href="../index.html">⚽ GolStats</a>
            <a href="../index.html" class="btn btn-outline-light btn-sm">← Volver al Hub</a>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container my-4">
        <div class="text-center mb-4">
            <h1 class="fw-bold text-success display-5">📰 Sala de Prensa</h1>
            <p class="text-secondary">Comunicados oficiales, ruedas de prensa e impresiones pospartido en tiempo real.</p>
        </div>

        <!-- Panel de Filtros y Buscador -->
        <div class="row justify-content-center mb-4">
            <div class="col-lg-10">
                <div class="bg-dark p-3 rounded border border-secondary shadow d-flex flex-wrap gap-3 align-items-center justify-content-between">
                    
                    <!-- Buscador -->
                    <div class="flex-grow-1" style="min-width: 250px;">
                        <input type="text" id="searchInput" class="form-control bg-black text-light border-secondary" placeholder="🔍 Buscar noticias, declaraciones o equipos...">
                    </div>

                    <!-- Filtros por Categoría -->
                    <div class="btn-group" role="group" id="filterGroup">
                        <button type="button" class="btn btn-outline-success active fw-semibold" data-category="todos">Todas</button>
                        <button type="button" class="btn btn-outline-success fw-semibold" data-category="oficial">Comunicados</button>
                        <button type="button" class="btn btn-outline-success fw-semibold" data-category="rueda">Ruedas de Prensa</button>
                        <button type="button" class="btn btn-outline-success fw-semibold" data-category="entrevista">Entrevistas</button>
                    </div>

                </div>
            </div>
        </div>

        <!-- Galería / Listado de Noticias -->
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div id="newsContainer" class="row g-4">
                    <!-- Las noticias se renderizan dinámicamente con JS -->
                </div>
            </div>
        </div>
    </main>

    <script src="../js/sala_celeste.js"></script>
</body>
</html>
