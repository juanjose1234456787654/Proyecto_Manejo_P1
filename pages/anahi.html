<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>Pizarra Tecnica Tactica | GolStats</title>
  <meta name="description" content="Disena estrategias, traza jugadas y formaciones en tiempo real sobre la cancha de futbol - GolStats.">
  <meta name="keywords" content="futbol, pizarra tactica, formaciones, estrategias, entrenador, 4-4-2, 4-3-3">
  <meta name="theme-color" content="#f0f5fa">

  <!-- Favicon SVG -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230ea5e9' stroke-width='2'><circle cx='12' cy='12' r='10'/><path d='M12 2a10 10 0 0 1 10 10'/></svg>">

  <!-- Google Fonts: Oswald + Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos del proyecto -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/pizarra_anahi.css">
</head>
<body>

  <!-- ============ NAVBAR ============ -->
  <nav class="p-nav" id="anahiNav" aria-label="Navegacion principal">
    <div class="p-nav__inner">
      <a href="../index.html" class="p-nav__logo" aria-label="Ir al Hub de GolStats">
        <span class="p-nav__logo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 2a10 10 0 0 1 6.35 2.3L14 8H10L5.65 4.3A10 10 0 0 1 12 2z"/>
            <path d="M2 12h4l2 4-3 3.5A10 10 0 0 1 2 12z"/>
            <path d="M22 12a10 10 0 0 1-3 7.5L16 16l2-4h4z"/>
          </svg>
        </span>
        GolStats
      </a>
      <a href="../index.html" class="p-btn-back" id="btnVolver">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Volver al Hub
      </a>
    </div>
  </nav>

  <!-- ============ HEADER ============ -->
  <header class="p-header">
    <div class="container">
      <div class="p-header__badge">
        <span class="p-header__badge-dot" aria-hidden="true"></span>
        Estrategia y DT
      </div>
      <h1 class="p-header__title">Pizarra Tecnica Tactica</h1>
      <p class="p-header__sub">Disena estrategias, traza jugadas clave y dibuja formaciones en tiempo real sobre el terreno de juego.</p>
    </div>
  </header>

  <!-- ============ MAIN CONTENT ============ -->
  <main class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-12">

        <!-- Panel de Controles Completo -->
        <div class="p-toolbar">

          <!-- 1. Selector de Estilo de Cancha -->
          <div class="p-group">
            <span class="p-group-label">Cancha:</span>
            <button type="button" id="btnThemeGrass" class="p-btn active" title="Cancha de cesped">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
              Cesped
            </button>
            <button type="button" id="btnThemeNeon" class="p-btn" title="Cancha oscura neon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              Neon
            </button>
            <button type="button" id="btnThemeWood" class="p-btn" title="Cancha de parquet / futsal">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
              Futsal
            </button>
          </div>

          <!-- 2. Herramientas de Dibujo -->
          <div class="p-group">
            <button id="btnPencil" class="p-btn active" title="Herramienta de trazo libre">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              Dibujar
            </button>
            <button id="btnEraser" class="p-btn" title="Herramienta borrador">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
              Borrador
            </button>
          </div>

          <!-- 3. Color y Grosor -->
          <div class="p-group">
            <label for="colorPicker" class="p-group-label">Color:</label>
            <input type="color" id="colorPicker" value="#0ea5e9" class="form-control form-control-color" title="Selecciona color de trazo">

            <label for="lineWidth" class="p-group-label ms-2">Grosor:</label>
            <input type="range" id="lineWidth" min="1" max="10" value="3" class="form-range" style="width: 75px;" title="Grosor de linea">
          </div>

          <!-- 4. Sellos y Accesorios Tacticos -->
          <div class="p-group">
            <span class="p-group-label">Accesorios:</span>
            <button type="button" id="btnStampBall" class="p-btn" title="Colocar balon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
              Balon
            </button>
            <button type="button" id="btnStampCone" class="p-btn" title="Colocar cono">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 22 22 22"/></svg>
              Cono
            </button>
            <button type="button" id="btnStampArrow" class="p-btn" title="Trazar flecha">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
              Flecha
            </button>
          </div>

          <!-- 5. Formaciones Automaticas -->
          <div class="p-group">
            <span class="p-group-label">Sistema:</span>
            <button id="btn442" class="p-btn" title="Formacion 4-4-2">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              4-4-2
            </button>
            <button id="btn433" class="p-btn" title="Formacion 4-3-3">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              4-3-3
            </button>
          </div>

          <!-- 6. Guardar y Cargar Tacticas -->
          <div class="p-group">
            <input type="text" id="tacticNameInput" class="p-input-text" placeholder="Nombre jugada..." style="width: 125px;" aria-label="Nombre de jugada">
            <button id="btnSaveTactic" class="p-btn p-btn--sky" title="Guardar jugada actual">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Guardar
            </button>
            <select id="savedTacticsSelect" class="p-select" style="width: 140px;" aria-label="Seleccionar jugada guardada">
              <option value="">-- Cargar jugada --</option>
            </select>
            <button id="btnLoadTactic" class="p-btn" title="Cargar jugada seleccionada">Cargar</button>
            <button id="btnDeleteTactic" class="p-btn p-btn--danger" title="Eliminar jugada seleccionada">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>

          <!-- 7. Acciones Principales -->
          <div class="p-group">
            <button id="btnClear" class="p-btn p-btn--danger" title="Limpiar todos los trazos">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
              Limpiar
            </button>
            <button id="btnDownload" class="p-btn p-btn--green" title="Descargar como imagen PNG">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Exportar PNG
            </button>
          </div>

        </div>

        <!-- Cancha de Futbol -->
        <div class="field-container">
          <canvas id="pizarraCanvas" width="800" height="500"></canvas>
        </div>

      </div>
    </div>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="p-footer">
    <div class="container">
      <p class="mb-0">&copy; 2026 GolStats &mdash; Pizarra Tecnica Tactica &mdash; Proyecto academico UTA</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/pizarra_anahi.js"></script>
</body>
</html>
