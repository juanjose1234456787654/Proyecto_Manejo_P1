<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GolStats - Pizarra Técnica Táctica</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/pizarra_anahi.css">
</head>
<body class="bg-dark text-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black py-3 border-bottom border-success">
        <div class="container">
            <a class="navbar-brand fw-bold text-success fs-3" href="../index.html">⚽ GolStats</a>
            <a href="../index.html" class="btn btn-outline-light btn-sm">← Volver al Hub</a>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container my-4">
        <div class="text-center mb-4">
            <h1 class="fw-bold text-success display-5">📋 Pizarra Técnica Táctica</h1>
            <p class="text-secondary">Diseña estrategias, traza jugadas y dibuja formaciones en tiempo real sobre la cancha.</p>
        </div>

        <div class="row justify-content-center">
            <!-- Panel de Controles Completo -->
            <div class="col-lg-12 mb-3 d-flex justify-content-center align-items-center gap-2 flex-wrap bg-dark p-3 rounded border border-secondary shadow">
                <!-- Selector de Estilo de Cancha -->
                <div class="d-flex align-items-center gap-1 mx-1 border-end border-secondary pe-2">
                    <label class="text-white fw-semibold mb-0 me-1">Cancha:</label>
                    <div class="btn-group btn-group-sm" role="group">
                        <button type="button" id="btnThemeGrass" class="btn btn-outline-success active fw-semibold">🌱 Césped</button>
                        <button type="button" id="btnThemeNeon" class="btn btn-outline-success fw-semibold">⚡ Neón</button>
                        <button type="button" id="btnThemeWood" class="btn btn-outline-success fw-semibold">🪵 Futsal</button>
                    </div>
                </div>

                <!-- Herramientas de Dibujo -->
                <button id="btnPencil" class="btn btn-success fw-semibold">✏️ Dibujar</button>
                <button id="btnEraser" class="btn btn-warning fw-semibold">🧹 Borrador</button>
                
                <div class="d-flex align-items-center gap-1 mx-1">
                    <label for="colorPicker" class="text-white fw-semibold mb-0">Color:</label>
                    <input type="color" id="colorPicker" value="#00ffcc" class="form-control form-control-color bg-dark border-secondary" title="Selecciona color">
                </div>

                <div class="d-flex align-items-center gap-2 mx-1 border-end border-secondary pe-2">
                    <label for="lineWidth" class="text-white fw-semibold mb-0">Grosor:</label>
                    <input type="range" id="lineWidth" min="1" max="10" value="3" class="form-range" style="width: 80px;">
                </div>

                <!-- Sellos y Accesorios Tácticos -->
                <div class="d-flex align-items-center gap-1 mx-1 border-end border-secondary pe-2">
                    <label class="text-white fw-semibold mb-0 me-1">Accesorios:</label>
                    <div class="btn-group btn-group-sm" role="group">
                        <button type="button" id="btnStampBall" class="btn btn-outline-warning fw-semibold">⚽ Pelota</button>
                        <button type="button" id="btnStampCone" class="btn btn-outline-warning fw-semibold">🟧 Cono</button>
                        <button type="button" id="btnStampArrow" class="btn btn-outline-warning fw-semibold">➡️ Flecha</button>
                    </div>
                </div>

                <!-- Módulo LocalStorage: Guardar / Cargar Tácticas -->
                <div class="d-flex align-items-center gap-1 mx-1 border-end border-secondary pe-2">
                    <input type="text" id="tacticNameInput" class="form-control form-control-sm bg-black text-light border-secondary" placeholder="Nombre jugada..." style="width: 130px;">
                    <button id="btnSaveTactic" class="btn btn-sm btn-info text-white fw-semibold">💾 Guardar</button>
                    <select id="savedTacticsSelect" class="form-select form-select-sm bg-black text-light border-secondary" style="width: 140px;">
                        <option value="">📂 Cargar...</option>
                    </select>
                    <button id="btnLoadTactic" class="btn btn-sm btn-outline-light fw-semibold">Cargar</button>
                    <button id="btnDeleteTactic" class="btn btn-sm btn-outline-danger fw-semibold" title="Eliminar seleccionada">❌</button>
                </div>

                <!-- Formaciones Automáticas -->
                <button id="btn442" class="btn btn-info text-white fw-semibold">⚽ 4-4-2</button>
                <button id="btn433" class="btn btn-info text-white fw-semibold">⚽ 4-3-3</button>

                <!-- Acciones -->
                <button id="btnClear" class="btn btn-danger fw-semibold">🗑️ Limpiar</button>
                <button id="btnDownload" class="btn btn-primary fw-semibold">📷 Exportar PNG</button>
            </div>

            <!-- Cancha de Fútbol -->
            <div class="col-lg-10 text-center">
                <div class="field-container shadow-lg rounded border border-2 border-success position-relative mx-auto">
                    <canvas id="pizarraCanvas" width="800" height="500"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/pizarra_anahi.js"></script>
</body>
</html>
